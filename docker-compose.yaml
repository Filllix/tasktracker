services:
 db:
   image: postgres:16
   ports:
     - "127.0.0.1:5432:5432"
   environment:
     POSTGRES_USER: app
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
     POSTGRES_DB: ${POSTGRES_DB}
   volumes:
     - dbdata:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
     interval: 3s
     retries: 10

 api:
   build: .
   environment:
     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
   ports:
     - "8000:8000"
   depends_on:
     db:
       condition: service_healthy
   healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  dbdata: