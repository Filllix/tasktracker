services:
 db:
   image: postgres:16
   ports:
     - "5432:5432"
   environment:
     POSTGRES_USER: app
     POSTGRES_PASSWORD: secret
     POSTGRES_DB: appdb
   volumes:
     - dbdata:/var/lib/postgresql/data
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
     interval: 3s
     retries: 10

 api:
   build: .
   environment:
     DATABASE_URL: postgresql://app:secret@db:5432/appdb
   ports:
     - "8000:8000"
   depends_on:
     db:
       condition: service_healthy

volumes:
  dbdata: